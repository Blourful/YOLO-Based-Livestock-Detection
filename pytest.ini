# pytest.ini (place in repo root)
[pytest]
# Tell pytest where tests live
testpaths = tests

# Put the repo root on sys.path so tests use absolute imports like:
#   from user_system.foo import bar
pythonpath = .

# Quiet default output; add -q to keep logs readable in CI
addopts = 
    -q
    --disable-warnings

# Optional: define custom markers you use (prevents "unknown marker" warnings)
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integ: integration tests
    train: training-related tests
    gpu: requires GPU

# Optional: keep noise down
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:Module already imported so cannot be rewritten;:pytest.PytestAssertRewriteWarning
    ignore::Warning

# Optional: consistent logging format if you capture logs
log_cli = true
log_cli_level = INFO
log_cli_format = %(levelname)s %(name)s: %(message)s

# Optional: strict xfail to catch accidental passes
xfail_strict = true

# Optional: avoid recursing into non-test dirs
norecursedirs = .* build dist .git .venv venv env

# Optional: require a minimum pytest version
minversion = 7.0

